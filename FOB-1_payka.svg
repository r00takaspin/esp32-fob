<line x1="12" y1="150" x2="285" y2="150" stroke="#1b2430" stroke-width="0.25" stroke-linecap="round"/>
<text x="14" y="157" font-family="Helvetica" font-size="2.1" fill="#1b2430" text-anchor="start" font-weight="bold" letter-spacing="0.6">3. ПОШАГОВО</text>
<circle cx="16" cy="163" r="3.0" fill="#1b2430"/>
<text x="16" y="164.1" font-family="Helvetica" font-size="2.3" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="21" y="164.1" font-family="Helvetica" font-size="1.75" fill="#1b2430" text-anchor="start" font-weight="normal">Прошей XIAO. USB-C в комп, Arduino IDE, blink.</text>
<circle cx="16" cy="173" r="3.0" fill="#1b2430"/>
<text x="16" y="174.1" font-family="Helvetica" font-size="2.3" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="21" y="174.1" font-family="Helvetica" font-size="1.75" fill="#1b2430" text-anchor="start" font-weight="normal">Проверь I2C: дисплей и RTC на макетку, сканер</text>
<text x="21" y="177.5" font-family="Helvetica" font-size="1.75" fill="#1b2430" text-anchor="start" font-weight="normal">должен увидеть 0x3C и 0x51.</text>
<circle cx="16" cy="183" r="3.0" fill="#1b2430"/>
<text x="16" y="184.1" font-family="Helvetica" font-size="2.3" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="21" y="184.1" font-family="Helvetica" font-size="1.75" fill="#1b2430" text-anchor="start" font-weight="normal">Припаяй 4 провода к дисплею: VCC, GND, SDA,</text>
<text x="21" y="187.5" font-family="Helvetica" font-size="1.75" fill="#1b2430" text-anchor="start" font-weight="normal">SCL. Длина 60 мм, провод 0,2 мм².</text>
<circle cx="16" cy="193" r="3.0" fill="#1b2430"/>
<text x="16" y="194.1" font-family="Helvetica" font-size="2.3" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<text x="21" y="194.1" font-family="Helvetica" font-size="1.75" fill="#1b2430" text-anchor="start" font-weight="normal">Припаяй 4 провода к плате RTC. Длина 40 мм —</text>
<text x="21" y="197.5" font-family="Helvetica" font-size="1.75" fill="#1b2430" text-anchor="start" font-weight="normal">она ляжет сверху на АКБ.</text>
<circle cx="108" cy="163" r="3.0" fill="#1b2430"/>
<text x="108" y="164.1" font-family="Helvetica" font-size="2.3" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
<text x="113" y="164.1" font-family="Helvetica" font-size="1.75" fill="#1b2430" text-anchor="start" font-weight="normal">Собери шину: 3V3 → VCC/VDD, GND → GND/GND, D4</text>
<text x="113" y="167.5" font-family="Helvetica" font-size="1.75" fill="#1b2430" text-anchor="start" font-weight="normal">→ SDA, D5 → SCL.</text>
<circle cx="108" cy="173" r="3.0" fill="#1b2430"/>
<text x="108" y="174.1" font-family="Helvetica" font-size="2.3" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text>
<text x="113" y="174.1" font-family="Helvetica" font-size="1.75" fill="#1b2430" text-anchor="start" font-weight="normal">Кнопка: 2 провода на D1 и GND. Провода заведи</text>
<text x="113" y="177.5" font-family="Helvetica" font-size="1.75" fill="#1b2430" text-anchor="start" font-weight="normal">в отверстие Ø2,5, мембрану приклей снаружи.</text>
<circle cx="108" cy="183" r="3.0" fill="#1b2430"/>
<text x="108" y="184.1" font-family="Helvetica" font-size="2.3" fill="#ffffff" text-anchor="middle" font-weight="bold">7</text>
<text x="113" y="184.1" font-family="Helvetica" font-size="1.75" fill="#1b2430" text-anchor="start" font-weight="normal">Проверь на столе от АКБ, USB отключён. Код</text>
<text x="113" y="187.5" font-family="Helvetica" font-size="1.75" fill="#1b2430" text-anchor="start" font-weight="normal">должен совпасть с телефоном.</text>
<circle cx="108" cy="193" r="3.0" fill="#1b2430"/>
<text x="108" y="194.1" font-family="Helvetica" font-size="2.3" fill="#ffffff" text-anchor="middle" font-weight="bold">8</text>
<text x="113" y="194.1" font-family="Helvetica" font-size="1.75" fill="#1b2430" text-anchor="start" font-weight="normal">АКБ: красный на BAT+, чёрный на BAT−.</text>
<text x="113" y="197.5" font-family="Helvetica" font-size="1.75" fill="#1b2430" text-anchor="start" font-weight="normal">Полярность перепутаешь — плата умрёт.</text>
<circle cx="200" cy="163" r="3.0" fill="#1b2430"/>
