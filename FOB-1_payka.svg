<text x="186" y="109" font-family="Helvetica" font-size="1.7" fill="#8b98a8" text-anchor="start" font-weight="normal">разрез по оси, масштаб 2:1</text>
<text x="176" y="142" font-family="Helvetica" font-size="1.65" fill="#8b98a8" text-anchor="start" font-weight="normal">Корпус 41 × 22 × 14 мм. RTC-макетка 15 × 10 × 4,5 — отдельным слоем над АКБ.</text>
<text x="176" y="145.6" font-family="Helvetica" font-size="1.65" fill="#8b98a8" text-anchor="start" font-weight="normal">В v2 RTC уедет на общую плату — корпус вернётся к 10–11 мм.</text>
<text x="268" y="121" font-family="Helvetica" font-size="2" fill="#8b98a8" text-anchor="end" font-weight="normal">14,0</text>
<line x1="269.5" y1="112" x2="269.5" y2="140" stroke="#8b98a8" stroke-width="0.2" stroke-linecap="round"/>
